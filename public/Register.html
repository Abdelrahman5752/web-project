<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h2>Future Tech</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="ai.html">AI</a></li>
            <li><a href="cloud.html">Cloud</a></li>
            <li><a href="security.html">Cyber Security</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li class="login-nav-link"><a href="login.html">Login</a></li><li><span class="user-display" style="display:none"></span></li>
        </ul>
        <button class="mode-btn" onclick="toggleMode()">🌙</button>
    </nav>

    <!-- Register Section -->
    <section class="login-section">
        <div class="login-box">
            <h1>Create Account</h1>
            <form class="login-form" onsubmit="registerUser(event)">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" minlength="12" maxlength="128" autocomplete="new-password" placeholder="Password (at least 12 characters)" required>
                <input type="password" id="confirm" minlength="12" maxlength="128" autocomplete="new-password" placeholder="Confirm Password" required>
                <button type="submit">Register</button>
                <p>Already have an account? <a href="login.html">Login</a></p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Future Tech Website</p>
    </footer>

    <script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
