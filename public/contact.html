<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h2>Future Tech</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="ai.html">AI</a></li>
            <li><a href="cloud.html">Cloud</a></li>
            <li><a href="security.html">Cyber Security</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li class="login-nav-link"><a href="login.html">Login</a></li><li><span class="user-display" style="display:none"></span></li>
            <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
        </ul>
    </nav>

    <!-- Contact Section -->
    <section class="content">
        <h1>Contact Us</h1>
        <form class="contact-form" onsubmit="submitContact(event)">
            <input type="text" name="name" aria-label="Your name" minlength="2" maxlength="80" placeholder="Your Name" required>
            <input type="email" name="email" aria-label="Your email" maxlength="254" placeholder="Your Email" required>
            <textarea name="message" aria-label="Your message" minlength="10" maxlength="5000" required placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Future Tech Website</p>
    </footer>

    <script src="script.js"></script>
<script src="app.js"></script>
</body>
</html>
